[workspace]
authors = ["Aleksandr Amochkin <aamochkin@marfa-tech.com>"]
channels = ["conda-forge"]
name = "networking4j"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.14.*"
openpyxl = ">=3.1.5,<4"

[pypi-dependencies]
fastapi = ">=0.141.1, <0.142"
uvicorn = { version = ">=0.52.1, <0.53", extras = ["standard"] }
neo4j = ">=6.2.0, <7"
pydantic = ">=2"
pydantic-settings = ">=2.15.0, <3"
nicegui = ">=3.15.0, <4"
pandas = ">=3.0.5, <4"
vobject = ">=0.9.9, <0.10"
rapidfuzz = ">=3.14.5, <4"
apscheduler = ">=3.11.3, <4"
loguru = ">=0.7.3, <0.8"
httpx = ">=0.28.1, <0.29"
typer = ">=0.27.1, <0.28"
onepassword-sdk = ">=0.4.1, <0.5"

[feature.dev.pypi-dependencies]
pytest = "*"
pytest-asyncio = "*"
testcontainers = { version = "*", extras = ["neo4j"] }
ruff = "*"
mypy = "*"

[environments]
default = { features = ["dev"], solve-group = "default" }
