[mypy]
python_version = 3.14
check_untyped_defs = True

# The official 1Password SDK ships without type stubs / a py.typed marker.
[mypy-onepassword.*]
ignore_missing_imports = True

# pandas ships stubs separately (pandas-stubs) and vobject ships none at all —
# neither is pulled in as a project dependency, so treat both as untyped
# rather than adding an extra stub-only dependency for stage 4's CSV/vCard
# import-export.
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-vobject.*]
ignore_missing_imports = True
